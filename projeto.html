<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - ONG</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        main {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #0A3B24;
        }
        fieldset {
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 20px;
        }
        legend {
            font-weight: bold;
            color: #0A3B24;
            padding: 0 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input:invalid:not(:placeholder-shown) {
            border-color: #d9534f;
        }
        button {
            background-color: #0A3B24;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #072b1b;
        }
    </style>
</head>
<body>

    <main>
        <h1>Cadastro de Voluntários e Doadores</h1>
        
        <form action="#" method="POST">
            
            <!-- Bloco 1: Informações Pessoais -->
            <fieldset>
                <legend>Informações Pessoais</legend>
                
                <div class="form-group">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" required placeholder="Digite seu nome completo">
                </div>

                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required placeholder="exemplo@email.com">
                </div>

                <div class="form-group">
                    <label for="nascimento">Data de Nascimento:</label>
                    <input type="date" id="nascimento" name="nascimento" required>
                </div>

                <div class="form-group">
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf" 
                           pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" 
                           maxlength="14" 
                           placeholder="000.000.000-00" 
                           required>
                </div>

                <div class="form-group">
                    <label for="telefone">Telefone / Celular:</label>
                    <input type="tel" id="telefone" name="telefone" 
                           pattern="\(\d{2}\)\s\d{5}-\d{4}" 
                           placeholder="(00) 00000-0000" 
                           required>
                </div>
            </fieldset>

            <!-- Bloco 2: Endereço e Localização -->
            <fieldset>
                <legend>Endereço e Localização</legend>

                <div class="form-group">
                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" name="cep" 
                           pattern="\d{5}-\d{3}" 
                           maxlength="9" 
                           placeholder="00000-000" 
                           required>
                </div>

                <div class="form-group">
                    <label for="endereco">Endereço:</label>
                    <input type="text" id="endereco" name="endereco" required placeholder="Rua, número e complemento">
                </div>

                <div class="form-group">
                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" name="cidade" required placeholder="Sua cidade">
                </div>

                <div class="form-group">
                    <label for="estado">Estado:</label>
                    <select id="estado" name="estado" required>
                        <option value="">Selecione o Estado</option>
                        <option value="SP">São Paulo</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="MG">Minas Gerais</option>
                        <!-- Outros estados conforme necessário -->
                    </select>
                </div>
            </fieldset>

            <button type="submit">Finalizar Cadastro</button>

        </form>
    </main>

</body>
</html>
